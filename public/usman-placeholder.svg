<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="100%" height="100%" fill="none">
  <!-- Stylized cutout silhouette placeholder until photo file is placed in /public/usman.png -->
  <defs>
    <linearGradient id="softFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="65%" stop-color="#000000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <g mask="url(#softFade)" filter="contrast(1.2)">
    <!-- Shoulders / Torso -->
    <path d="M 60 560 C 60 430, 110 390, 170 380 L 250 380 C 310 390, 360 430, 360 560 Z" fill="#1e1e1e" />
    <!-- Collar & Shirt Pattern -->
    <path d="M 170 380 L 210 460 L 250 380 L 220 370 L 200 370 Z" fill="#ffffff" />
    <path d="M 185 410 L 195 560" stroke="#ffffff" stroke-width="12" />
    <path d="M 225 410 L 235 560" stroke="#ffffff" stroke-width="12" />
    <path d="M 130 430 L 120 560" stroke="#ffffff" stroke-width="14" />
    <path d="M 290 430 L 300 560" stroke="#ffffff" stroke-width="14" />
    <!-- Neck -->
    <path d="M 180 340 L 180 390 C 180 405, 240 405, 240 390 L 240 340 Z" fill="#c49a7a" />
    <!-- Head / Face -->
    <ellipse cx="210" cy="275" rx="72" ry="92" fill="#d9ad8c" />
    <!-- Hair Volume -->
    <path d="M 134 260 C 125 180, 180 145, 220 145 C 275 145, 298 185, 286 260 C 275 220, 260 210, 210 210 C 160 210, 145 225, 134 260 Z" fill="#111111" />
    <!-- Ears -->
    <ellipse cx="138" cy="275" rx="9" ry="18" fill="#c49a7a" />
    <ellipse cx="282" cy="275" rx="9" ry="18" fill="#c49a7a" />
    <!-- Beard / Facial Hair Contour -->
    <path d="M 148 290 C 155 355, 180 370, 210 370 C 240 370, 265 355, 272 290 C 265 330, 240 355, 210 355 C 180 355, 155 330, 148 290 Z" fill="#222222" opacity="0.6" />
    <!-- Eyebrows -->
    <path d="M 160 250 Q 180 244 195 248" stroke="#111111" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 225 248 Q 240 244 260 250" stroke="#111111" stroke-width="4.5" stroke-linecap="round" />
    <!-- Eyes -->
    <ellipse cx="178" cy="265" rx="7" ry="4.5" fill="#1a1a1a" />
    <ellipse cx="242" cy="265" rx="7" ry="4.5" fill="#1a1a1a" />
    <!-- Nose -->
    <path d="M 210 262 L 206 288 Q 210 293 214 288 Z" fill="#b58766" />
    <!-- Lips -->
    <path d="M 195 318 Q 210 324 225 318" stroke="#a06752" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
